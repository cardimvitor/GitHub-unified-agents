name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - ccr-9ccfd58b-9y5v3q

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Inject public OAuth configuration
        env:
          GITHUB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GITHUB_CLIENT_ID }}
        run: |
          test -n "$GITHUB_CLIENT_ID"
          printf 'EXPO_PUBLIC_GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID" > .env
      - name: Build APK
        run: NODE_ENV=production npx expo prebuild --platform android --no-install && cd android && NODE_ENV=production ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unified-agents-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Draft GitHub release with the APK
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/ccr-9ccfd58b-9y5v3q'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
