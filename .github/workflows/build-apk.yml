name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Inject public OAuth configuration
        env:
          GITHUB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GITHUB_CLIENT_ID }}
        run: |
          test -n "$GITHUB_CLIENT_ID"
          printf 'EXPO_PUBLIC_GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID" > .env.production
      - name: Build APK
        run: npx expo prebuild --platform android --no-install && cd android && ./gradlew :app:assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unified-agents-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
